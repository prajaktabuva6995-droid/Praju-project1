<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Video - AI Text to Video</title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Custom CSS -->

    <link rel="stylesheet"
          href="./css/create.css">

</head>


<body>


<div class="container py-5">

    <div class="create-video">


        <!-- Heading -->

        <div class="text-center mb-4">

            <div class="logo-icon">

                <i class="bi bi-camera-reels"></i>

            </div>

            <h2>Create Video</h2>

            <p>
                Turn your text into an engaging slideshow video
            </p>

        </div>


        <!-- Form -->

        <form>


            <!-- Video Title -->

            <div class="row">

                <div class="col-12 mb-3">

                    <label class="form-label">
                        Video Title
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-type"></i>

                        </span>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Enter video title">

                    </div>

                </div>

            </div>


            <!-- Video discription -->

            <div class="row">

                <div class="col-12 mb-3">

                    <label class="form-label">
                        Video discription
                    </label>

                    <div class="input-group">

                        <span class="input-group-text textarea-icon">

                            <i class="bi bi-file-text"></i>

                        </span>

                        <textarea
                            class="form-control"
                            rows="5"
                            placeholder="Write or paste your text here..."></textarea>

                    </div>

                </div>

            </div>


            <!-- Select Style + Select Duration -->

            <div class="row">


                <!-- Select Style -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Select Style
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-palette"></i>

                        </span>

                        <select class="form-select">

                            <option selected disabled>
                                Select video style
                            </option>

                            <option>
                                Modern
                            </option>

                            <option>
                                Professional
                            </option>

                            <option>
                                Creative
                            </option>

                            <option>
                                Minimal
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Select Duration -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Select Duration
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-clock"></i>

                        </span>

                        <select class="form-select">

                            <option selected disabled>
                                Select duration
                            </option>

                            <option>
                                30 Seconds
                            </option>

                            <option>
                                1 Minute
                            </option>

                            <option>
                                2 Minutes
                            </option>

                            <option>
                                5 Minutes
                            </option>

                        </select>

                    </div>

                </div>

            </div>


            <!-- Video Level -->

            <div class="row">

                <div class="col-md-12 mb-3">

                    <label class="form-label">
                        Video Level
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-bar-chart"></i>

                        </span>

                        <select class="form-select">

                            <option selected disabled>
                                Select video level
                            </option>

                            <option>
                                Normal
                            </option>

                            <option>
                                Medium
                            </option>

                            <option>
                                Standard
                            </option>

                        </select>

                    </div>

                </div>

            </div>


            <!-- Create Video Button -->

            <div class="row">

                <div class="col-12">

                    <button
                        type="submit"
                        class="create-video-btn">

                        <i class="bi bi-stars"></i>

                        Create Video

                    </button>

                </div>

            </div>


        </form>

    </div>

</div>


</body>

</html>
