<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Video Creator - Registration</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" href="./css/register.css">
</head>

<body>

    <div class="container">

        <div class="row justify-content-center align-items-center min-vh-100">

            <div class="col-lg-6 col-md-8 col-sm-10">

                <!-- Registration Form -->

                <div class="registration-form">

                    <div class="text-center mb-4">

                        <div class="logo-icon">
                            <i class="bi bi-stars"></i>
                        </div>

                        <h2>Create Account</h2>

                        <p>
                            Register for AI Text-to-Video Slideshow Creator
                        </p>

                    </div>


                    <form>

                        <!-- Full Name -->

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-person"></i>
                                </span>

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                    required>

                            </div>

                        </div>


                        <!-- Email -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-envelope"></i>
                                </span>

                                <input
                                    type="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required>

                            </div>

                        </div>


                        <!-- Mobile -->

                        <div class="mb-3">

                            <label class="form-label">
                                Mobile Number
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-phone"></i>
                                </span>

                                <input
                                    type="tel"
                                    class="form-control"
                                    placeholder="Enter mobile number"
                                    required>

                            </div>

                        </div>


                        <!-- College -->

                        <div class="mb-3">

                            <label class="form-label">
                                College Name
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-building"></i>
                                </span>

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Enter your college name"
                                    required>

                            </div>

                        </div>


                        <!-- Course -->

                        <div class="mb-3">

                            <label class="form-label">
                                Course
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-mortarboard"></i>
                                </span>

                                <select
                                    class="form-select"
                                    required>

                                    <option
                                        value=""
                                        selected
                                        disabled>
                                        Select your course
                                    </option>

                                    <option>BCA</option>
                                    <option>B.Sc Computer Science</option>
                                    <option>B.Tech</option>
                                    <option>MCA</option>
                                    <option>M.Sc Computer Science</option>
                                    <option>Other</option>

                                </select>

                            </div>

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-lock"></i>
                                </span>

                                <input
                                    type="password"
                                    class="form-control"
                                    placeholder="Create password"
                                    required>

                            </div>

                        </div>


                        <!-- Confirm Password -->

                        <div class="mb-3">

                            <label class="form-label">
                                Confirm Password
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-shield-lock"></i>
                                </span>

                                <input
                                    type="password"
                                    class="form-control"
                                    placeholder="Confirm password"
                                    required>

                            </div>

                        </div>


                        <!-- Terms -->

                        <div class="form-check mb-4">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="terms"
                                required>

                            <label
                                class="form-check-label"
                                for="terms">

                                I agree to the
                                <a href="#">
                                    Terms & Conditions
                                </a>

                            </label>

                        </div>


                        <!-- Register Button -->

                        <button
                            type="submit"
                            class="btn register-btn">

                            <i class="bi bi-person-plus me-2"></i>

                            Register

                        </button>


                        <!-- Login -->

                        <p class="login-text">

                            Already have an account?

                            <a href="#">
                                Login
                            </a>

                        </p>

                    </form>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
